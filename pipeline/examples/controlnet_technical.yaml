# pipeline/examples/controlnet_technical.yaml
#
# Example pipeline: Technical blueprint style via ControlNet + Stable Diffusion 1.5
#
# Converts an image into a technical drawing / engineering blueprint look.
# The Canny edge detector preserves hard edges and geometric structure,
# making it ideal for architectural and mechanical subjects.
#
# Notes:
# - Requires: pip install diffusers transformers safetensors torch accelerate
# - First run downloads ~4GB of models (ControlNet + SD 1.5)
# - CPU-only: ~30–60 minutes per image
# - GPU (CUDA): ~30–120 seconds per image
# - 16 GB RAM: enable_model_cpu_offload is enabled below (required)

steps:

  # Step 1: Load input image
  # source_path is provided via CLI --input (no path needed here)
  - step: load_image
    config:
      style_res: 512

  # Step 2: Apply artistic style
  - step: stylise_controlnet
    config:
      prompt: "technical drawing, engineering blueprint, architectural plan, precise lines, white lines on dark background, schematic, monochrome"
      negative_prompt: "painting, color, watercolor, photorealistic, blurry, organic, artistic"

      hf_token_path: ".hf_token"

      # Canny preserves hard geometric edges — ideal for technical subjects
      controlnet_type: canny

      num_inference_steps: 30 # Slightly higher for fine linework
      guidance_scale: 9.0 # Higher guidance = stronger prompt adherence

      base_model: "runwayml/stable-diffusion-v1-5"
      device: auto # auto | cpu | cuda | mps
      enable_model_cpu_offload: true # Required on 16 GB RAM; offloads weights to CPU between steps

  # Step 3: Save output image
  # output_path is provided via CLI --output (no path needed here)
  - step: save_image
    config: {}
