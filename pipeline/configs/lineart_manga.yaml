# pipeline/configs/lineart_manga.yaml
#
# Example pipeline: Lineart / manga-style detection for pen plotting
#
# Uses the MangaLine / sk_model detector from controlnet-aux to extract clean,
# anime and manga-style outlines. Produces very smooth, continuous strokes —
# ideal for illustrated subjects, portraits, and stylized imagery.
#
# Notes:
# - Requires: pip install controlnet-aux
# - First run downloads model weights from Hugging Face (~100 MB)
# - CPU: ~5–20 seconds per image depending on resolution
# - GPU (CUDA / MPS): ~1–5 seconds per image
# - lineart_coarse: false = fine lines (sk_model.pth)
#                   true  = coarser, bolder lines (sk_model2.pth)
# - lineart_detect_res / lineart_image_res: internal model resolution;
#   lower values are faster but may lose fine detail

name: "Lineart: Manga Style"
description: "Neural network lineart detection (MangaLine / sk_model) — clean, anime and manga-style outlines with very smooth, continuous strokes. Ideal for portraits and illustrated subjects."

steps:
  # Step 1: Load input image
  # source_path is provided via CLI --input (no path needed here)
  - step: load_image
    label: "Load Input Image"
    config: {}

  # Step 2: Apply lineart / manga detector
  - step: stylise_lineart
    label: "Stylize: Lineart / Manga Detection"
    config:
      style_res: 1024 # Longest side of intermediate image in pixels

      # Path to local model weights (null = auto-download from Hugging Face)
      model_path: null

      # Compute device: auto | cpu | cuda | mps
      # auto = selects MPS on Apple Silicon, CUDA if available, else CPU
      device: auto

      # false = fine sk_model.pth  |  true = coarse sk_model2.pth
      lineart_coarse: false

      # Internal detector resolution — reduce to 256 for faster but coarser output
      lineart_detect_res: 512
      lineart_image_res: 512

  # Step 3: Vectorize the lineart image to paths
  - step: vectorise
    label: "Vectorize Paths"
    config:
      min_path_px: 10 # Minimum path length in pixels (shorter paths discarded)
      simplify_eps: 1.5 # Ramer-Douglas-Peucker tolerance in pixels

  # Step 4: Generate GCode for GRBL plotter
  - step: gcode_from_svg
    label: "Generate GCode (TOML Profile)"
    config:
      profile: "grbl_a4_pen"
      target_width_mm: 180.0 # Drawing width in mm (default: 190.0 = A4 - 2x5mm margins)
      target_height_mm: 250.0 # Drawing height in mm (default: 277.0 = A4 - 2x10mm margins)
      keep_aspect: true # Maintain aspect ratio
      linesort: true # Optimize path order by travel distance

  # Step 5: Save GCode to file
  # output_path is provided via CLI --output (no path needed here)
  - step: save_gcode
    config: {}
