# pipeline/examples/img2img_charcoal.yaml
#
# Example pipeline: Charcoal drawing style via img2img + Stable Diffusion v1.5
#
# Produces a high-contrast, expressive charcoal sketch. High strength (0.85)
# aggressively transforms the image toward the charcoal aesthetic, trading
# structural fidelity for dramatic shadows and rough texture.
#
# Notes:
# - Requires: pip install diffusers transformers safetensors torch accelerate
# - First run downloads ~4GB of models
# - CPU-only: ~10–30 minutes per image
# - GPU (CUDA): ~1–3 minutes per image
# - GPU (M1/M2/M3): ~3–10 minutes per image
# - 16 GB RAM: enable_model_cpu_offload is enabled below (required)

name: "Img2Img: Charcoal Drawing"
description: "Charcoal drawing style via img2img + Stable Diffusion — high strength (0.85) aggressively transforms toward dramatic shadows, rough texture, and expressive strokes."

steps:
  # Step 1: Load input image
  # source_path is provided via CLI --input (no path needed here)
  - step: load_image
    label: "Load Input Image"
    config:
      style_res: 512

  # Step 2: Apply artistic style
  - step: stylise_img2img
    label: "Stylize: Img2Img Charcoal Drawing"
    config:
      prompt: "charcoal drawing, dramatic shadows, rough texture, expressive strokes, high contrast, smudged edges, monochrome, fine art sketch"
      negative_prompt: "color, photorealistic, smooth, digital, watercolor, blurry, low contrast"

      # High strength: aggressive transformation, strong stylization
      strength: 0.85

      num_inference_steps: 25
      guidance_scale: 8.5 # Stronger guidance for the dramatic charcoal look

      model_id: "stable-diffusion-v1-5/stable-diffusion-v1-5"
      hf_token_path: ".hf_token"
      device: auto # auto | cpu | cuda | mps
      enable_model_cpu_offload: true # Required on 16 GB RAM; offloads weights to CPU between steps

  # Step 3: Save output image
  # output_path is provided via CLI --output (no path needed here)
  - step: save_image
    label: "Save Stylized Image"
    config: {}
