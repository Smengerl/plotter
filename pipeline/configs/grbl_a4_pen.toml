# pipeline/configs/grbl_a4_pen.toml
#
# Standard GCode profile for GRBL pen plotter, A4 format
# -------------------------------------------------------
# Coordinate system:  Origin bottom-left, Y pointing up (GRBL standard)
# Pen control:        Servo via M3/M5 (GRBL spindle mode) or laser mode
# Units:              mm
# Page dimensions:    A4 = 210 × 297 mm (vpype-gcode-compatible TOML)
#
# This profile is loaded by GCodeFromSvgStep when no
# other profile is explicitly configured.
# It is fully compatible with the vpype-gcode TOML format —
# can be used 1:1 as ~/.vpype.toml or passed via --config,
# once vpype supports Python 3.14.
#
# Reference profiles: gcode, ninja, step_motor from vpype_gcode/bundled_configs.toml

[gwrite]
default_profile = "grbl_a4_pen"

[gwrite.grbl_a4_pen]
# Profile notes:
# - This profile targets the GRBL pen plotter in A4 (210×297 mm) using mm units.
# - IMPORTANT: This profile assumes an inverted solenoid wiring where the
#   solenoid is ENERGIZED = pen UP (lift). That means:
#     * M3 S1000 => energize solenoid => pen up
#     * M5        => de-energize solenoid => pen down
#   If your hardware is non-inverted, swap M3/M5 in the templates below.
# - Dwell time after pen switch is controlled by the `G4 P...` in `segment_first`;
#   currently set to 0.5 s to give the solenoid time to move. Increase if needed.
# - Solenoid heat: pen-up = coil energized. The templates below pull in at
#   S1000 then hold at S350 (~35 % PWM) to limit the heat during travel.
#   Tune S_HOLD on the real machine (see the document_start comment).
#   Still keep travel moves short (linesort is on by default).
# - Travel feedrate (fast moves) is set to 3000 mm/min (G1 F3000) in the header.
#   Drawing feedrate (when pen is down) is set in `segment_first` to 1500 mm/min.
# - Offsets `offset_x`/`offset_y` define a safety margin from the paper edge.
# Template keys used by the GCodeFromSvgStep:
#  - document_start: header emitted at start of file (initialization, units, homing
#                    safe moves, initial pen state)
#  - segment_first: emitted before the first point of every path (move to start,
#                   lower pen, set drawing feedrate)
#  - segment: emitted for intermediate points
#  - segment_last: emitted for the last point (identical to segment here)
#  - line_end: emitted after each path (raise pen)
#  - document_end: footer emitted at the end of the file
# Adjust these templates carefully; M3/M5 control the solenoid state.
# Coordinate transformation
unit          = "mm"
vertical_flip = true    # SVG: Origin top-left → GCode: Origin bottom-left

# Margins / offset within the drawing area
offset_x = 5.0          # 5 mm left margin
offset_y = 5.0          # 5 mm bottom margin (after vertical_flip)

# Plotter header.
# Pen up = solenoid energized (inverted mount). Pull in at full drive, dwell
# 50 ms to seat the plunger, then drop to a HOLD level so the coil does not
# overheat while the pen is up. Tune S_HOLD (see below): raise it if the pen
# drifts down during travel, lower it if the coil still gets hot.
document_start = """; GRBL Pen Plotter — A4 Format
; Generated by img2gcode (GCodeFromSvgStep)
G21       ; Units mm
G90       ; Absolute coordinates
G1 F3000  ; Standard travel speed
M3 S1000  ; Pen up — pull in
G4 P0.05
M3 S350   ; Pen up — hold (~35 %); tune this value
G1 X5.000 Y5.000 F3000
"""

# Per path: Move (pen up), lower pen, set feedrate
segment_first = """G1 X{x:.3f} Y{y:.3f} F3000
M5
G4 P0.5
G1 F1500
"""

# All remaining points of the path
segment = "G1 X{x:.3f} Y{y:.3f}\n"

# Last point of the path — identical to segment (no special behavior)
segment_last = "G1 X{x:.3f} Y{y:.3f}\n"

# After each path: pen up. Pull in at S1000, then hold at S350 (see the
# document_start note — same S_HOLD value). Keeps the solenoid cool across
# the pen-up travel move that follows in the next segment_first.
line_end = "M3 S1000\nG4 P0.05\nM3 S350\n"

# Plotter footer: de-energize the solenoid (pen down = safe, no coil heat),
# then advance the paper to the end of the sheet.
document_end = """; Done
M5
G1 X5.000 Y292.000 F3000
"""

# Info message after output (printed to stderr)
info = "GCode for GRBL pen plotter (A4) created."
