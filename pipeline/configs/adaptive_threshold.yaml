# pipeline/configs/adaptive_threshold.yaml
#
# Example pipeline: Adaptive threshold binarization for pen plotting
#
# Converts an image to a clean binary edge map using local adaptive thresholding.
# Works robustly with uneven illumination — no neural network required.
# Fast, CPU-only, no model download needed.
#
# Notes:
# - No GPU or internet connection required
# - Very fast (~1–5 seconds per image)
# - Ideal for high-contrast subjects (documents, logos, illustrations)
# - Adjust block_size and adapt_c for your image content

name: "Adaptive Threshold"
description: "CPU-only adaptive threshold binarization — robust with uneven illumination, no neural network needed. Fast, ideal for documents and high-contrast subjects."

steps:
  # Step 1: Load input image
  # source_path is provided via CLI --input (no path needed here)
  - step: load_image
    label: "Load Input Image"
    config: {}

  # Step 2: Apply adaptive threshold binarization
  - step: stylise_adaptive
    label: "Stylize: Adaptive Threshold"
    config:
      style_res: 1024 # Longest side of intermediate image in pixels

      # Local neighborhood size for threshold computation (must be odd, ≥ 3)
      # Larger values = coarser adaptation to local illumination
      block_size: 11

      # Subtraction constant — increases produce thinner lines
      # Tune this first: lower = more detail, higher = cleaner/fewer lines
      adapt_c: 2.0

      # Thresholding method: gaussian (weighted) or mean (uniform)
      adapt_method: gaussian

      # Blur before thresholding (0 = off, must be odd if > 0)
      # Small blur (e.g. 3) reduces noise at the cost of fine detail
      adapt_blur: 0

  # Step 3: Vectorize the binary image to paths
  - step: vectorise
    label: "Vectorize Paths"
    config:
      min_path_px: 10 # Minimum path length in pixels (shorter paths discarded)
      simplify_eps: 1.5 # Ramer-Douglas-Peucker tolerance in pixels

  # Step 4: Generate GCode for GRBL plotter
  - step: gcode_from_svg
    label: "Generate GCode (TOML Profile)"
    config:
      profile: "grbl_a4_pen"
      target_width_mm: 180.0 # Drawing width in mm (default: 190.0 = A4 - 2x5mm margins)
      target_height_mm: 250.0 # Drawing height in mm (default: 277.0 = A4 - 2x10mm margins)
      keep_aspect: true # Maintain aspect ratio
      linesort: true # Optimize path order by travel distance

  # Step 5: Save GCode to file
  # output_path is provided via CLI --output (no path needed here)
  - step: save_gcode
    label: "Save GCode"
    config: {}
