# pipeline/configs/demo_controlnet_style.yaml
#
# Demo pipeline: Style transfer using ControlNet + Stable Diffusion 1.5
#
# This pipeline converts any image into an artistic sketch-like drawing
# with a specified style via text prompt. The result is then vectorized
# and converted to GCode for pen plotting.
#
# Notes:
# - Requires: pip install diffusers transformers safetensors torch accelerate
# - First run downloads ~4GB of models (ControlNet + SD 1.5)
# - CPU-only: ~30–60 minutes per image
# - GPU (CUDA): ~30–120 seconds per image
# - Use enable_model_cpu_offload: true to reduce VRAM (slower)

steps:
  # Step 1: Apply artistic style using ControlNet + SD 1.5
  #
  # This step converts the input image to an artistic style
  # guided by the text prompt and ControlNet conditioning.
  - step: stylise_controlnet
    config:
      # Style prompt - adjust to your artistic goal
      prompt: "ink drawing, pen sketch, detailed line art, professional illustration, monochrome"
      negative_prompt: "watercolor, photorealistic, color, blurry, low quality, distorted"

      # HuggingFace token (optional, for gated models)
      # If using gated models, save token to file and set path here
      # Get token: https://huggingface.co/settings/tokens
      # Save: echo 'hf_xxx...' > .hf_token
      hf_token_path: ".hf_token"

      # ControlNet type - determines what structure is preserved
      # Options: canny, lineart, softedge, scribble, pose, depth, normal, seg
      controlnet_type: lineart

      # Diffusion settings
      num_inference_steps: 25 # Higher = better quality, slower
      guidance_scale: 7.5 # How much to follow prompt (1–15)
      strength: 0.8 # How much to modify image (0–1)

      # Model and device
      model_id: "runwayml/stable-diffusion-v1-5"
      device: auto # auto | cpu | cuda | mps
      enable_model_cpu_offload: false # Reduce VRAM at cost of speed

  # Step 2: Convert to vector paths
  - step: vectorise
    config:
      min_path_px: 10 # Minimum path length (shorter = more detail)
      simplify_eps: 1.5 # Path simplification tolerance

  # Step 3: Generate GCode
  - step: gcode_gen
    config:
      target_width_mm: 180.0
      target_height_mm: 250.0
      origin_x: 5.0
      origin_y: 5.0
      keep_aspect: true
      feedrate_draw: 1500
      feedrate_travel: 3000
      pen_down_cmd: "M3 S1000"
      pen_up_cmd: "M5"
      pen_delay_ms: 100

  # Step 4: Save GCode to file
  - step: save_gcode
    config: {}

  # Step 5 (Optional): Send directly to GRBL plotter
  - step: send_gcode
    enabled: false
    config:
      port: /dev/tty.usbmodem1101
      baud: 115200
      dry_run: false
      response_timeout_s: 30.0
