# pipeline/tests/pipeline_configs/stylize_img2img.yaml
#
# Test pipeline with Image-to-Image style transfer using Stable Diffusion 2.1
# (lightweight model, no ControlNet)

steps:
  # Step 1: Apply img2img style transfer
  - step: stylise_img2img
    config:
      prompt: "oil painting, artistic style, detailed brushstrokes"
      negative_prompt: "blurry, watercolor, photorealistic"
      strength: 0.7 # How much to modify (0.0–1.0)
      num_inference_steps: 20
      guidance_scale: 7.5
      model_id: "stabilityai/stable-diffusion-2-1-base"
      hf_token_path: ".hf_token"
      enable_model_cpu_offload: false
      device: auto

  # Step 2: Vectorization - Convert to paths
  - step: vectorise
    config:
      min_path_px: 10
      simplify_eps: 1.5

  # Step 3: GCode generation
  - step: gcode_gen
    config:
      target_width_mm: 180.0
      target_height_mm: 250.0
      origin_x: 5.0
      origin_y: 5.0
      keep_aspect: true
      feedrate_draw: 1500
      feedrate_travel: 3000
      pen_down_cmd: "M3 S1000"
      pen_up_cmd: "M5"
      pen_delay_ms: 100

  # Step 4: Save to file
  - step: save_gcode
    config: {}
