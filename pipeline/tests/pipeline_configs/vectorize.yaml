# pipeline/tests/pipeline_configs/stylize_adaptive.yaml
#
# Test pipeline with adaptive threshold binarization.
# Robust with uneven illumination.

steps:
  - step: load_image
    # The test runner provides the real image path via metadata['source_path']
    config: {}

  - step: save_image
    config:
      output_path: "output/vectorized_image.png"

  - step: vectorise
    config:
      min_path_px: 10
      simplify_eps: 1.5

  - step: gcode_gen
    config:
      target_width_mm: 180.0
      target_height_mm: 250.0
      origin_x: 5.0
      origin_y: 5.0
      keep_aspect: true
      feedrate_draw: 1500
      feedrate_travel: 3000
      pen_down_cmd: "M3 S1000"
      pen_up_cmd: "M5"
      pen_delay_ms: 100

  - step: save_gcode
    config:
      output_path: "output/vectorized_image.gcode"
