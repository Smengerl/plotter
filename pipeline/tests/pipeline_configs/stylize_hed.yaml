# pipeline/tests/pipeline_configs/stylize_hed.yaml
#
# Test pipeline with HED (Holistically-nested Edge Detection).
# Neural network model — requires controlnet_aux.
# Model is automatically downloaded from Hugging Face on first run.

name: "HED Edge Detection"
description: "Holistically-nested Edge Detection — neural network model producing soft, multi-scale edges."

steps:
  - step: load_image
    label: "Load Image"
    # The test runner provides the real image path via metadata['source_path']
    config: {}

  - step: stylise_hed
    label: "Stylize via HED"
    config:
      style_res: 1024 # longest side of intermediate image in pixels
      model_path: null # null = auto-download from Hugging Face
      device: auto # auto | cpu | cuda | mps

  - step: save_image
    label: "Save Image"
    config:
      output_path: "output/hed_image.png"
