# pipeline/tests/pipeline_configs/stylize_informative.yaml
#
# Test pipeline with Informative Drawings (ONNX/PyTorch sketching model).
# No controlnet_aux required — uses own model weights.
# Model is automatically downloaded from Hugging Face on first run.

steps:
  - step: stylise_informative
    config:
      style_res: 1024 # longest side of intermediate image in pixels
      model_path: null # null = auto-download from Hugging Face
      device: auto # auto | cpu | cuda | mps
      inform_style: 1 # 1 = sharper (model.pth), 2 = softer (model2.pth)

  - step: vectorise
    config:
      min_path_px: 10
      simplify_eps: 1.5

  - step: gcode_gen
    config:
      target_width_mm: 180.0
      target_height_mm: 250.0
      origin_x: 5.0
      origin_y: 5.0
      keep_aspect: true
      feedrate_draw: 1500
      feedrate_travel: 3000
      pen_down_cmd: "M3 S1000"
      pen_up_cmd: "M5"
      pen_delay_ms: 100

  - step: save_gcode
    config: {}
