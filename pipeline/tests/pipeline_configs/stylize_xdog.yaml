# pipeline/tests/pipeline_configs/stylize_xdog.yaml
#
# Test pipeline with XDoG (Extended Difference of Gaussians).
# Produces sketch-like, artistic lines.

steps:
  - step: load_image
    # The test runner provides the real image path via metadata['source_path']
    config: {}

  - step: stylise_xdog
    config:
      style_res: 1024 # longest side of intermediate image in pixels
      sigma: 0.4 # σ of small Gaussian function
      k_sigma: 1.6 # ratio σ_large / σ_small
      epsilon: 0.0 # threshold (-1..1, 0 = adaptive)
      phi: 10.0 # steepness of sigmoid function
      threshold: 20.0 # final binarization threshold (0–255)

  - step: save_image
    config:
      output_path: "output/xdog_image.png"
