; PlatformIO Project Configuration File
; G-code Pen Plotter — Arduino Uno + CNC Shield + GRBL
;
; Build:        pio run
; Flash:        pio run -t upload
; Serial monitor (115200 baud): pio device monitor
;
; Standalone hardware test sketches (no GRBL):
;   pio run -e tc1_x_axis      -t upload
;   pio run -e tc2_endstops     -t upload
;   pio run -e tc3_y_axis      -t upload
;   pio run -e tc4_pen_lift    -t upload

; ── Shared base settings ──────────────────────────────────────────────────
[base]
platform  = atmelavr
board     = uno
framework = arduino
monitor_speed = 115200

; ── GRBL production firmware ─────────────────────────────────────────────
[env:uno]
platform  = ${base.platform}
board     = ${base.board}
framework = ${base.framework}
monitor_speed = ${base.monitor_speed}


; Upload via USB/serial — override with your port if needed:
; upload_port = /dev/tty.usbmodem*   ; macOS example
; upload_port = /dev/ttyUSB0         ; Linux example
; upload_port = COM3                  ; Windows example

; src/         – our own main.cpp + grbl_main_shim.c + config.h
; ../grbl/grbl – all GRBL *.c sources EXCEPT main.c (which defines int main())
;                The Arduino framework provides its own main(); our main.cpp
;                calls grbl_main() which is declared in grbl_main_shim.c.
build_src_filter =
    +<*>
    +<../grbl/grbl/*.c>
    -<grbl/grbl/main.c>
    ; test wrappers live under firmware/test/* and are not part of the
    ; production firmware build. No need to explicitly exclude them here
    ; when test envs use their own src_dir.

; -include src/config.h force-includes our config into every translation unit
; before anything else. It pulls in the stock grbl/grbl/config.h and then
; applies the plotter overrides. Without -include, grbl.h's own
; `#include "config.h"` would always pick the submodule's sibling file and
; src/config.h would have no effect.
build_flags =
    -I src
    -I grbl/grbl
    -include src/config.h
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; ── TC1: X-Axis Movement Test ─────────────────────────────────────────────
[env:tc1_x_axis]
platform  = ${base.platform}
board     = ${base.board}
framework = ${base.framework}
monitor_speed = ${base.monitor_speed}
; Build the standalone test sketch from its own folder. The test folder
; contains the sketch and the local `plotter_pins.h`. GRBL C sources are
; not needed for this build; we add the GRBL include path only for cpu_map.h.
build_src_filter =
    +<../test/tc1_x_axis/tc1_x_axis.cpp>
    -<main.cpp>
    -<grbl_main_shim.c>
    -<../grbl/grbl/*.c>
build_flags =
    -I grbl/grbl
    -DCPU_MAP_ATMEGA328P


