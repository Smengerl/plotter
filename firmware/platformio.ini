; PlatformIO Project Configuration File
; G-code Pen Plotter — Arduino Uno + CNC Shield + GRBL
;
; Build:        pio run
; Flash:        pio run -t upload
; Serial monitor (115200 baud): pio device monitor
;
; Standalone hardware test sketches (no GRBL):
;   pio run -e tc1_x_axis      -t upload
;   pio run -e tc2_x_endstops  -t upload
;   pio run -e tc3_y_axis      -t upload
;   pio run -e tc4_pen_lift    -t upload

; ── Shared base settings ──────────────────────────────────────────────────
[base]
platform  = atmelavr
board     = uno
framework = arduino
monitor_speed = 115200

; ── GRBL production firmware ─────────────────────────────────────────────
[env:uno]
platform  = ${base.platform}
board     = ${base.board}
framework = ${base.framework}
monitor_speed = ${base.monitor_speed}

; Upload via USB/serial — override with your port if needed:
; upload_port = /dev/tty.usbmodem*   ; macOS example
; upload_port = /dev/ttyUSB0         ; Linux example
; upload_port = COM3                  ; Windows example

; src/         – our own main.cpp + grbl_main_shim.c + config.h
;                config.h here shadows the one inside grbl/grbl/
; ../grbl/grbl – all GRBL *.c sources EXCEPT main.c (which defines int main())
;                The Arduino framework provides its own main(); our main.cpp
;                calls grbl_main() which is declared in grbl_main_shim.c.
src_dir          = src
build_src_filter =
    +<*>
    +<../../grbl/grbl/*.c>
    -<../../grbl/grbl/main.c>

; 1. src/        → our config.h is found *before* the one inside grbl/grbl/
; 2. ../grbl/grbl → all GRBL headers (grbl.h, cpu_map.h, …) resolve directly
build_flags =
    -I src
    -I ../grbl/grbl
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; ── TC1: X-Axis Movement Test ─────────────────────────────────────────────
[env:tc1_x_axis]
platform  = ${base.platform}
board     = ${base.board}
framework = ${base.framework}
monitor_speed = ${base.monitor_speed}
src_dir   = test/tc1_x_axis
; plotter_pins.h braucht cpu_map.h aus dem GRBL-Submodul und
; CPU_MAP_ATMEGA328P muss gesetzt sein, damit der richtige Pinblock aktiv ist.
build_flags =
    -I ../grbl/grbl
    -DCPU_MAP_ATMEGA328P

; ── TC2: X-Axis Endstop Test ──────────────────────────────────────────────
[env:tc2_x_endstops]
platform  = ${base.platform}
board     = ${base.board}
framework = ${base.framework}
monitor_speed = ${base.monitor_speed}
src_dir   = test/tc2_x_endstops
build_flags =
    -I ../grbl/grbl
    -DCPU_MAP_ATMEGA328P

; ── TC3: Y-Axis Movement Test ─────────────────────────────────────────────
[env:tc3_y_axis]
platform  = ${base.platform}
board     = ${base.board}
framework = ${base.framework}
monitor_speed = ${base.monitor_speed}
src_dir   = test/tc3_y_axis
build_flags =
    -I ../grbl/grbl
    -DCPU_MAP_ATMEGA328P

; ── TC4: Pen Lift (Solenoid) Test ─────────────────────────────────────────
[env:tc4_pen_lift]
platform  = ${base.platform}
board     = ${base.board}
framework = ${base.framework}
monitor_speed = ${base.monitor_speed}
src_dir   = test/tc4_pen_lift
build_flags =
    -I ../grbl/grbl
    -DCPU_MAP_ATMEGA328P
